name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 27
        # The project needs Xcode 27+ (Swift 6, swift-format). Fail loudly instead of linting with an older toolchain.
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode 27 не найден на раннере; доступны: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version && swift --version
      - name: Lint and privacy boundaries
        run: scripts/lint.sh
      - name: Boundary guard regressions
        run: python3 scripts/test-network-boundaries.py
      - name: Core and coordinator tests
        run: scripts/test.sh core
